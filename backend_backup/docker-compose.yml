version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=school_management_db
      - DB_USER=root
      - DB_PASSWORD=secretpassword
      - DB_SYNC=true
      - JWT_SECRET=supersecretjwtkey12345!
      - JWT_REFRESH_SECRET=supersecretrefreshjwtkey98765!
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=uploads
    volumes:
      - upload_data:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: school_management_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecretpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  upload_data:
